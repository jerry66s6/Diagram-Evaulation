[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "diagram-correctness"
version = "0.1.0"
description = "Multi-judge correctness evaluation for rendered diagrams"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.49.0",
  "openai>=1.99.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
diagram-correctness = "diagram_correctness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

